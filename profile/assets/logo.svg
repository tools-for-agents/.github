<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="tools-for-agents — the agent loop">
  <defs>
    <radialGradient id="core" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1b1f29"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="#0a0b0e"/>
  <rect x="1.5" y="1.5" width="197" height="197" rx="42.5" fill="none" stroke="#20242e" stroke-width="1.5"/>

  <!-- the loop: 8 arcs, each in the colour of the node it leads to -->
  <g fill="none" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M100 40 A60 60 0 0 1 142.43 57.57" stroke="#4fd6be"/>
    <path d="M142.43 57.57 A60 60 0 0 1 160 100" stroke="#ff6a1a"/>
    <path d="M160 100 A60 60 0 0 1 142.43 142.43" stroke="#a78bfa"/>
    <path d="M142.43 142.43 A60 60 0 0 1 100 160" stroke="#e0a24e"/>
    <path d="M100 160 A60 60 0 0 1 57.57 142.43" stroke="#38bdf8"/>
    <path d="M57.57 142.43 A60 60 0 0 1 40 100" stroke="#ec4899"/>
    <path d="M40 100 A60 60 0 0 1 57.57 57.57" stroke="#c792ea"/>
    <path d="M57.57 57.57 A60 60 0 0 1 100 40" stroke="#6ea8fe"/>
  </g>

  <!-- 8 tool nodes: soft halo + solid dot -->
  <g>
    <circle cx="100" cy="40" r="15" fill="#6ea8fe" opacity="0.16"/><circle cx="100" cy="40" r="8.5" fill="#6ea8fe"/>
    <circle cx="142.43" cy="57.57" r="15" fill="#4fd6be" opacity="0.16"/><circle cx="142.43" cy="57.57" r="8.5" fill="#4fd6be"/>
    <circle cx="160" cy="100" r="15" fill="#ff6a1a" opacity="0.16"/><circle cx="160" cy="100" r="8.5" fill="#ff6a1a"/>
    <circle cx="142.43" cy="142.43" r="15" fill="#a78bfa" opacity="0.16"/><circle cx="142.43" cy="142.43" r="8.5" fill="#a78bfa"/>
    <circle cx="100" cy="160" r="15" fill="#e0a24e" opacity="0.16"/><circle cx="100" cy="160" r="8.5" fill="#e0a24e"/>
    <circle cx="57.57" cy="142.43" r="15" fill="#38bdf8" opacity="0.16"/><circle cx="57.57" cy="142.43" r="8.5" fill="#38bdf8"/>
    <circle cx="40" cy="100" r="15" fill="#ec4899" opacity="0.16"/><circle cx="40" cy="100" r="8.5" fill="#ec4899"/>
    <circle cx="57.57" cy="57.57" r="15" fill="#c792ea" opacity="0.16"/><circle cx="57.57" cy="57.57" r="8.5" fill="#c792ea"/>
  </g>

  <!-- agent core -->
  <circle cx="100" cy="100" r="17" fill="url(#core)" stroke="#333947" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="4.5" fill="#e8ebf2"/>
</svg>
